name: Package Windows release
description: Finish the build, sign binaries, create and sign the installer, and upload packages
inputs:
  arch:
    description: Target architecture (x86_64 or arm64)
    required: true
  azure-tenant-id:
    description: AZURE_TENANT_ID
    required: true
  azure-client-id:
    description: AZURE_CLIENT_ID
    required: true
  azure-client-secret:
    description: AZURE_CLIENT_SECRET
    required: true
  azure-signing-endpoint:
    description: AZURE_SIGNING_ENDPOINT
    required: true
  azure-signing-account:
    description: AZURE_SIGNING_ACCOUNT
    required: true
  azure-signing-certificate-name:
    description: AZURE_SIGNING_CERTIFICATE_NAME
    required: true
outputs:
  version:
    description: Version of the packaged release
    value: ${{ steps.stage3.outputs.version }}
runs:
  using: composite
  steps:
    - name: Run Stage
      id: stage
      uses: ./.github/actions/stage
      with:
        arm: ${{ inputs.arch == 'arm64' }}
        from_artifact: true

    - name: Check build completed
      if: steps.stage.outputs.finished != 'true'
      shell: pwsh
      run: throw 'Build did not finish within the available stages'

    - name: Sign Helium binaries
      uses: azure/artifact-signing-action@v1
      with:
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-client-secret: ${{ inputs.azure-client-secret }}
        endpoint: ${{ inputs.azure-signing-endpoint }}
        signing-account-name: ${{ inputs.azure-signing-account }}
        certificate-profile-name: ${{ inputs.azure-signing-certificate-name }}
        files: ${{ steps.stage.outputs.files-to-sign }}
        description: Helium
        description-url: https://github.com/imputnet/helium-windows

    # we want a different description here, so sign it separately again
    - name: Sign Helium update helper
      uses: azure/artifact-signing-action@v1
      with:
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-client-secret: ${{ inputs.azure-client-secret }}
        endpoint: ${{ inputs.azure-signing-endpoint }}
        signing-account-name: ${{ inputs.azure-signing-account }}
        certificate-profile-name: ${{ inputs.azure-signing-certificate-name }}
        files: C:\helium-windows\build\src\out\Default\helium_update_helper.exe
        description: Helium Update Helper
        description-url: https://github.com/imputnet/helium-windows

    - name: Build Helium installer and package
      id: stage2
      uses: ./.github/actions/stage
      with:
        gen_installer: true
        arm: ${{ inputs.arch == 'arm64' }}
        from_artifact: false

    - name: Sign Helium installer
      uses: azure/artifact-signing-action@v1
      with:
        azure-tenant-id: ${{ inputs.azure-tenant-id }}
        azure-client-id: ${{ inputs.azure-client-id }}
        azure-client-secret: ${{ inputs.azure-client-secret }}
        endpoint: ${{ inputs.azure-signing-endpoint }}
        signing-account-name: ${{ inputs.azure-signing-account }}
        certificate-profile-name: ${{ inputs.azure-signing-certificate-name }}
        files: C:\helium-windows\build\helium*-installer.exe
        description: Helium Installer
        description-url: https://github.com/imputnet/helium-windows

    - name: Upload artifacts
      id: stage3
      uses: ./.github/actions/stage
      with:
        upload_final: true
        arm: ${{ inputs.arch == 'arm64' }}
        from_artifact: false
